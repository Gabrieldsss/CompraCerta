# Publica o CompraCerta como web app (PWA) no GitHub Pages a cada push na main.
# É a versão usada no iPhone (Safari → Compartilhar → Adicionar à Tela de Início).
# Requisitos no repositório:
#   - Settings → Pages → Source: "GitHub Actions"
#   - Settings → Secrets and variables → Actions: SUPABASE_URL e SUPABASE_CHAVE (chave publicável)
name: Publicar web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Preparar www/ com a configuração do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CHAVE: ${{ secrets.SUPABASE_CHAVE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_CHAVE" ]; then
            echo "::error::Cadastre os segredos SUPABASE_URL e SUPABASE_CHAVE em Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/build.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - id: publicacao
        uses: actions/deploy-pages@v5
